services:
  db:
    image: postgres:17-alpine
    container_name: giroam-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-giroam}
      POSTGRES_USER: ${POSTGRES_USER:-giroam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-giroam}
    volumes:
      - giroam_pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-giroam} -d ${POSTGRES_DB:-giroam}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    container_name: giroam-migrate
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-giroam}:${POSTGRES_PASSWORD:-giroam}@db:5432/${POSTGRES_DB:-giroam}
      DATABASE_SSL: "false"
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "db:migrate"]
    restart: "no"

  seed:
    build: .
    container_name: giroam-seed
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-giroam}:${POSTGRES_PASSWORD:-giroam}@db:5432/${POSTGRES_DB:-giroam}
      DATABASE_SSL: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["npx", "tsx", "src/scripts/seed.ts"]
    restart: "no"
    profiles:
      - seed

  app:
    build: .
    container_name: giroam-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-giroam}:${POSTGRES_PASSWORD:-giroam}@db:5432/${POSTGRES_DB:-giroam}
      DATABASE_SSL: "false"
      APP_URL: ${APP_URL:-http://localhost:3000}
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  giroam_pgdata:
